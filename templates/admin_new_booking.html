{% extends 'admin_base.html' %}{% block content %}<div class="admin-heading"><div><div class="eyebrow">БЫСТРОЕ ДЕЙСТВИЕ</div><h1>Новая бронь</h1><p>Для клиента, который позвонил или написал в WhatsApp.</p></div></div><form class="panel admin-form" method="post" id="admin-booking-form"><div class="form-grid"><div class="wide"><label>Автомобиль</label><select name="car_id" id="admin-car-id">{% for c in cars %}<option value="{{ c.id }}" data-price="{{ c.price }}">{{ c.name }} — {{ c.city }} — {{ c.price }} ₸/сутки</option>{% endfor %}</select></div><div><label>Дата получения</label><input required type="date" name="pickup_date" id="admin-pickup"></div><div><label>Время</label><input type="time" name="pickup_time" value="10:00"></div><div><label>Дата возврата</label><input required type="date" name="return_date" id="admin-return"></div><div><label>Время</label><input type="time" name="return_time" value="10:00"></div><div class="wide"><div id="admin-availability" class="availability-note"></div></div><div><label>Имя клиента</label><input required name="customer_name"></div><div><label>Телефон</label><input required name="phone"></div><div><label>Email</label><input name="email"></div><div><label>Место выдачи</label><input name="pickup_location" value="Офис проката"></div><div><label>Итоговая цена, ₸</label><input type="number" name="total" id="admin-total" placeholder="Автоматически"></div><div><label>Комментарий / допы</label><input name="extras" placeholder="Детское кресло, доставка..."></div></div><div class="form-actions"><a class="btn btn-light" href="{{ url_for('admin_bookings') }}">Отмена</a><button class="btn btn-primary" id="admin-submit">Создать и подтвердить</button></div></form>{% endblock %}
