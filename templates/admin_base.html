<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Автопрокат Актобе — Admin{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}"></head><body class="admin-body"><aside class="admin-sidebar"><a class="brand" href="{{ url_for('admin_dashboard') }}">Drive<span> Aktobe</span><small>ADMIN</small></a><nav><a href="{{ url_for('admin_dashboard') }}">⌂ Главная</a><a href="{{ url_for('admin_bookings') }}">▣ Бронирования</a><a href="{{ url_for('admin_calendar') }}">▦ Календарь</a><a href="{{ url_for('admin_cars') }}">🚘 Автомобили</a><a href="{{ url_for('admin_clients') }}">◉ Клиенты</a><a href="{{ url_for('admin_payments') }}">₸ Платежи</a><a href="{{ url_for('admin_promos') }}">◇ Промокоды</a><a href="{{ url_for('admin_analytics') }}">↗ Аналитика</a><a href="{{ url_for('admin_settings') }}">⚙ Настройки</a></nav><a class="admin-exit" href="{{ url_for('home') }}">← На сайт</a></aside><main class="admin-main"><header class="admin-top"><button class="admin-menu" type="button" onclick="document.body.classList.toggle('sidebar-open')">☰</button><form class="admin-search" action="{{ url_for('admin_search') }}"><span>⌕</span><input name="q" value="{{ q or '' }}" placeholder="Поиск по броням, клиентам, авто"><button aria-label="Найти">Найти</button></form><div class="admin-user"><a class="notify" href="{{ url_for('admin_notifications') }}">🔔{% if unread_notifications %}<b>{{ unread_notifications }}</b>{% endif %}</a><div><strong>Администратор</strong><small>Владелец</small></div><div class="avatar sm">A</div></div></header><div class="admin-content">{% block content %}{% endblock %}</div></main><script src="{{ url_for('static', path='js/app.js') }}"></script></body></html>
