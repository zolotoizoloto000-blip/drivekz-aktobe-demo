{% extends 'admin_base.html' %}{% block content %}<div class="admin-heading"><div><div class="eyebrow">АВТОПАРК</div><h1>{% if car %}Изменить автомобиль{% else %}Добавить автомобиль{% endif %}</h1></div></div><form class="panel admin-form" method="post"><div class="form-grid"><div class="wide"><label>Название</label><input required name="name" value="{{ car.name if car else '' }}" placeholder="Toyota Camry 70"></div><div><label>Город</label><input required name="city" value="{{ car.city if car else 'Алматы' }}"></div><div><label>Цена / сутки</label><input required type="number" name="price" value="{{ car.price if car else 25000 }}"></div><div><label>Класс</label><select name="class">{% for x in ['Эконом','Комфорт','Бизнес','Премиум'] %}<option {% if car and car.class==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></div><div><label>Кузов</label><select name="body">{% for x in ['Седан','Кроссовер','Внедорожник','Минивэн','Купе'] %}<option {% if car and car.body==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></div><div><label>Коробка</label><select name="gearbox"><option>Автомат</option><option {% if car and car.gearbox=='Механика' %}selected{% endif %}>Механика</option></select></div><div><label>Топливо</label><select name="fuel">{% for x in ['Бензин','Дизель','Гибрид','Электро'] %}<option {% if car and car.fuel==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></div><div><label>Мест</label><input type="number" name="seats" value="{{ car.seats if car else 5 }}"></div><div><label>Год</label><input type="number" name="year" value="{{ car.year if car else 2026 }}"></div><div><label>Залог</label><input type="number" name="deposit" value="{{ car.deposit if car else 100000 }}"></div><div><label>Рейтинг</label><input type="number" step="0.1" min="0" max="5" name="rating" value="{{ car.rating if car else 5 }}"></div><div><label>Статус</label><select name="status">{% for x in statuses %}<option {% if car and car.status==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></div><div class="wide"><label>Изображение (путь в static)</label><input name="image" value="{{ car.image if car else 'img/camry.svg' }}"></div><div><label>Бейдж</label><input name="badge" value="{{ car.badge if car else '' }}" placeholder="Популярный"></div><div class="wide"><label>Оснащение через запятую</label><textarea name="features" rows="3">{{ car.features|join(', ') if car else 'Климат-контроль, Apple CarPlay, Камера 360°, Круиз-контроль' }}</textarea></div></div><div class="form-actions"><a class="btn btn-light" href="{{ url_for('admin_cars') }}">Отмена</a><button class="btn btn-primary">Сохранить</button></div></form>{% endblock %}
