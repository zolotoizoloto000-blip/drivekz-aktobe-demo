{% extends 'admin_base.html' %}{% block content %}<div class="admin-heading"><div><div class="eyebrow">СИСТЕМА</div><h1>Настройки</h1><p>Основные параметры проката и уведомлений.</p></div></div><form class="panel admin-form" method="post"><div class="form-grid"><div><label>Название компании</label><input name="company_name" value="{{ current.company_name }}"></div><div><label>Телефон</label><input name="phone" value="{{ current.phone }}"></div><div><label>WhatsApp</label><input name="whatsapp" value="{{ current.whatsapp }}"></div><div><label>Email поддержки</label><input type="email" name="support_email" value="{{ current.support_email }}"></div><div><label>Валюта</label><input name="currency" value="{{ current.currency }}"></div><div><label>Режим подтверждения</label><select name="booking_mode"><option value="manual" {% if current.booking_mode=='manual' %}selected{% endif %}>Менеджером</option><option value="auto" {% if current.booking_mode=='auto' %}selected{% endif %}>Автоматически после оплаты</option></select></div><div><label>Повторное напоминание, минут</label><input type="number" name="reminder_minutes" value="{{ current.reminder_minutes }}"></div></div><button class="btn btn-primary">Сохранить настройки</button></form>{% endblock %}
